[package]
name = "agent-god-view-shell"
version = "0.1.0"
description = "Agent God View native shell"
authors = ["Agent God View"]
edition = "2021"

[lib]
name = "agent_god_view_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
